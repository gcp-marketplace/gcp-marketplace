<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Product suite - Thank You</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f0fe 0%, #d2e3fc 100%);
            overflow-x: hidden;
        }

        /* --- CSS CLOUDS BACKGROUND --- */
        .cloud-bg {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 100px;
        }

        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 50%;
        }

        .cloud-1 { width: 160px; height: 50px; top: 15%; left: 10%; }
        .cloud-1::before { width: 70px; height: 70px; top: -30px; left: 20px; }
        .cloud-1::after { width: 90px; height: 90px; top: -45px; right: 20px; }

        .cloud-2 { width: 220px; height: 70px; top: 50%; right: 5%; }
        .cloud-2::before { width: 90px; height: 90px; top: -40px; left: 30px; }
        .cloud-2::after { width: 120px; height: 120px; top: -60px; right: 30px; }

        .cloud-3 { width: 120px; height: 40px; bottom: 20%; left: 20%; }
        .cloud-3::before { width: 50px; height: 50px; top: -20px; left: 15px; }
        .cloud-3::after { width: 60px; height: 60px; top: -30px; right: 15px; }

        /* --- CARD STYLING --- */
        .card {
            background-color: #ffffff;
            padding: 48px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
            z-index: 1;
            border-top: 6px solid #34a853; /* Google Green for success */
            text-align: center;
        }

        .logo-container {
            margin-bottom: 24px;
        }

        .logo-container img {
            max-height: 50px;
            max-width: 180px;
            object-fit: contain;
        }

        .success-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e6f4ea;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            margin: 0 auto 24px auto;
        }

        h2 {
            color: #202124;
            margin: 0 0 16px 0;
            font-size: 28px;
            font-weight: 700;
        }

        p {
            color: #5f6368;
            font-size: 15px;
            line-height: 1.6;
            margin: 0;
        }
        
        strong {
            color: #202124;
        }
    </style>
</head>
<body>
    <!-- Background Clouds -->
    <div class="cloud-bg">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <div class="card">
        <!-- Partner directly provides their logo URL here -->
        <div class="logo-container">
            <img src="sample-image.png" alt="Product Logo" onerror="this.style.display='none'">
        </div>

        <div class="success-icon">
            <!-- Google Checkmark SVG -->
            <svg xmlns="http://www.w3.org/2000/svg" height="40" viewBox="0 -960 960 960" width="40" fill="#34a853">
                <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/>
            </svg>
        </div>
        
        <h2>Thank You!</h2>
        
        <!-- Updated text with hardcoded product name -->
        <p>Your purchase to <strong>Sample Product suite</strong> through Google Cloud Marketplace has been successfully processed.</p>
    </div>
</body>
</html>
